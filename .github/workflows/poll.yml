name: Poll job boards

on:
  schedule:
    - cron: '*/30 * * * *'

  # lets you run it by hand from the Actions tab without waiting for the schedule
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - run: pip install -r requirements-poll.txt

      - run: python poll_jobs.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # notify.py no-ops when these are unset, so the poll still works
          # normally until the secrets exist
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          # a repo variable, not a secret — it's just role names, and having it
          # visible makes it easy to see what you're watching
          NOTIFY_ROLES: ${{ vars.NOTIFY_ROLES }}
